<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wangsiyuan.net网站</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      color: #9e0808;
      background: #ee6800;
      font-family: "STKaiti", "KaiTi", "FangSong", serif;
    }

    .certificate {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      aspect-ratio: 1200 / 900;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(150px, 28vh, 300px) 14vw clamp(135px, 19vh, 210px);
      background: url("./p.jpeg") center / 100% 100% no-repeat;
      text-align: center;
      isolation: isolate;
    }

    .content {
      width: min(720px, 72vw);
      transform: rotate(-0.5deg);
      text-shadow: 0 2px 0 rgba(255,255,255,.48);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-family: Arial, sans-serif;
      font-size: clamp(11px, 1.2vw, 17px);
      font-weight: 900;
      letter-spacing: .22em;
      color: #5a3300;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 78px);
      line-height: 1;
      letter-spacing: .08em;
    }

    .name {
      display: inline-block;
      margin: clamp(15px, 2.3vw, 26px) 0 12px;
      padding: 0 .2em .08em;
      border-bottom: 4px solid #b61010;
      font-size: clamp(30px, 5vw, 66px);
      font-weight: 900;
      color: #111;
    }

    .copy {
      margin: 0 auto;
      max-width: 650px;
      font-size: clamp(16px, 2vw, 27px);
      font-weight: 700;
      line-height: 1.75;
      color: #401600;
    }

    .award-time {
      margin-top: clamp(16px, 2vw, 24px);
      font: 700 clamp(13px, 1.5vw, 19px)/1.6 Arial, sans-serif;
      letter-spacing: .08em;
      color: #7a2500;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
    }

    .stamp {
      position: absolute;
      right: 21%;
      bottom: 18%;
      width: clamp(88px, 11vw, 142px);
      height: clamp(88px, 11vw, 142px);
      display: grid;
      place-items: center;
      border: clamp(4px, .55vw, 7px) double #d20b0b;
      border-radius: 50%;
      transform: rotate(-17deg);
      font: 900 clamp(14px, 1.8vw, 23px)/1.15 Arial, sans-serif;
      color: #d20b0b;
      opacity: .82;
    }

    .serial {
      position: absolute;
      left: 16%;
      bottom: 13%;
      font: 700 clamp(9px, 1vw, 14px)/1.5 monospace;
      color: rgba(73, 32, 0, .7);
      text-align: left;
    }

    .gc {
      font-family: Arial, sans-serif;
      font-weight: 900;
      color: #f06b18;
      -webkit-text-stroke: 1px #7b2600;
    }

    .sound {
      position: fixed;
      z-index: 30;
      top: clamp(12px, 2.4vh, 24px);
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: .4em;
      border: 1px solid #000;
      border-radius: 3px;
      padding: clamp(9px, 1.2vh, 13px) clamp(18px, 2.4vw, 30px);
      background: #161616;
      color: #fff;
      font-family: inherit;
      font-size: clamp(14px, 1.4vw, 19px);
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color .15s ease;
    }

    .sound:hover,
    .sound:focus-visible {
      background: #000;
    }

    .sound:focus-visible {
      outline: 2px solid #161616;
      outline-offset: 3px;
    }

    .sound:active {
      background: #2b2b2b;
    }

    .confetti {
      position: fixed;
      z-index: 10;
      top: -12vh;
      width: 10px;
      height: 22px;
      opacity: .9;
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translate3d(10vw, 120vh, 0) rotate(720deg); }
    }

    @media (max-aspect-ratio: 4/3) {
      .certificate {
        min-height: 100svh;
        aspect-ratio: auto;
        padding: 25vh 12vw 19vh;
        background-size: cover;
      }

      .stamp { right: 14%; bottom: 17%; }
      .serial { left: 13%; bottom: 12%; }
    }
  </style>
</head>
<body>
  <main class="certificate">
    <section class="content" aria-label="Cloudflare人类认证奖状">
      <p class="eyebrow">wangsiyuan.net</p>
      <h1>尊贵的用户</h1>
      <div class="name">我们验证了您是人类</div>
      <p class="copy">
        鉴于您成功点击了那个小方块或者贵公司大发慈悲，<br>
        <span class="gc">GOOGLE RECAPTCHA</span> 已正式验证您为<br>
        <strong>「货真价实的人类」</strong>。<br>
        特发此证，以资鼓励。<br>
        <small>©2026 wangsiyuan.net   然后这个网站是chatgpt写的</small>
      </p>
      <div class="award-time" id="award-time">颁奖时间：加载中...</div>
    </section>

    <div class="stamp">非机器人<br>特此认证</div>
    <div class="serial">证书编号：GR-HUMAN-114514<br>检测置信度：大概是真的</div>
  </main>

  <audio id="bgm" src="./m.mp3" autoplay loop preload="auto"></audio>
  <button class="sound" id="sound" type="button">▶ 播放颁奖音乐</button>

  <script>
    const audio = document.querySelector('#bgm');
    const button = document.querySelector('#sound');

    audio.volume = 0.5;

    function syncLabel() {
      if (!audio.paused && audio.muted) {
        button.textContent = '🔇 点击开启声音';
        return;
      }
      button.textContent = audio.paused ? '▶ 播放颁奖音乐' : '❚❚ 暂停颁奖音乐';
    }

    async function playMusic() {
      try {
        await audio.play();
        return true;
      } catch (_) {
        return false;
      }
    }

    // 带声音的自动播放基本都会被浏览器拦截：
    // 被拦截时先静音播放（浏览器允许），用户任意操作后再立刻恢复声音。
    async function autoplay() {
      if (await playMusic()) return;
      audio.muted = true;
      await playMusic();
      syncLabel();
    }

    function enableSound() {
      if (!audio.muted) return;
      audio.muted = false;
      playMusic();
      syncLabel();
    }

    let gestureCleared = false;
    const gestures = ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'];
    function onFirstGesture(event) {
      if (gestureCleared) return;
      if (event.target instanceof Element && event.target.closest('.sound')) return;
      gestureCleared = true;
      gestures.forEach((type) => window.removeEventListener(type, onFirstGesture));
      enableSound();
    }
    gestures.forEach((type) => window.addEventListener(type, onFirstGesture, { passive: true }));

    button.addEventListener('click', () => {
      if (audio.muted) {
        enableSound();
        return;
      }
      if (audio.paused) playMusic();
      else audio.pause();
    });

    audio.addEventListener('play', syncLabel);
    audio.addEventListener('pause', syncLabel);
    audio.addEventListener('volumechange', syncLabel);
    syncLabel();

    window.addEventListener('load', autoplay);
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) autoplay();
    });

    const awardTime = document.querySelector('#award-time');
    function updateAwardTime() {
      const now = new Date();
      awardTime.textContent = `颁奖时间：${now.toLocaleDateString('zh-CN')}`;
    }
    updateAwardTime();
    setInterval(updateAwardTime, 1000);

    const colors = ['#f00', '#ffdf00', '#0057ff', '#00a43a', '#ff69b4', '#ff7a00', '#9b00ff', '#ffffff'];
    for (let i = 0; i < 90; i++) {
      const piece = document.createElement('i');
      piece.className = 'confetti';
      piece.style.left = Math.random() * 100 + 'vw';
      piece.style.background = colors[i % colors.length];
      piece.style.width = 6 + Math.random() * 8 + 'px';
      piece.style.height = 12 + Math.random() * 16 + 'px';
      piece.style.animationDuration = 4 + Math.random() * 5 + 's';
      piece.style.animationDelay = -Math.random() * 8 + 's';
      document.body.appendChild(piece);
    }
  </script>
</body>
</html>
